receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch:
    timeout: 1s
    send_batch_size: 1024
  memory_limiter:
    limit_mib: 512
    check_interval: 1s

exporters:
  otlp/jaeger:
    endpoint: http://jaeger:4317
    tls:
      insecure: true
  
  otlphttp/neodev1:
    endpoint: https://api-neodev1.aus-dsom-rke2-01.k8s.stackify.com
    headers:
      X-Api-Key: 463510059::F6BKK7X58QYJF3T16K8UC59J03VD4U::vbKces5aaJDM2O87rrAjItasFzrBwk0CB7vKUCe8KRfLcC620M
      X-Source: reviews-dumpster-fire
    sending_queue:
      enabled: true
      num_consumers: 100
      queue_size: 10000
    compression: gzip
  
  debug:

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlp/jaeger, debug, otlphttp/neodev1]
    metrics:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/neodev1, debug]
    logs:
      receivers: [otlp]
      processors: [memory_limiter, batch]
      exporters: [otlphttp/neodev1, debug]
  
  extensions: [] 