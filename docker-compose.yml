services:
  # OpenTelemetry Collector
  otel-collector:
    image: otel/opentelemetry-collector-contrib:latest
    command: ["--config=/etc/otel-collector-config.yaml"]
    volumes:
      - ./collector/collector.yaml:/etc/otel-collector-config.yaml
    ports:
      - "4317:4317"   # OTLP gRPC receiver
      - "4318:4318"   # OTLP HTTP receiver
    depends_on:
      - jaeger

  # Jaeger backend and UI
  jaeger:
    image: jaegertracing/all-in-one:latest
    ports:
      - "16686:16686"  # Jaeger UI
      - "14317:4317"   # OTLP gRPC (external:internal)
      - "14318:4318"   # OTLP HTTP (external:internal)
    environment:
      - COLLECTOR_OTLP_ENABLED=true
  mysql:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: doutorequemtemdoutorado  #
      MYSQL_DATABASE: books
      MYSQL_USER: books
      MYSQL_PASSWORD: doutorequemtemdoutorado
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  mysql-reviews:
    image: mysql:8.0
    environment:
      MYSQL_ROOT_PASSWORD: doutorequemtemdoutorado  #
      MYSQL_DATABASE: reviews
      MYSQL_USER: reviews
      MYSQL_PASSWORD: doutorequemtemdoutorado
    ports:
      - "3308:3306"
    volumes:
      - mysql_review_data:/var/lib/mysql

  redis:
    image: redis:latest
    ports:
      - "6379:6379"

  spring-gateway:
    build:
      context: .
      dockerfile: ./gateway/Dockerfile
    pull_policy: build
    environment: 
      OTEL_SERVICE_NAME: spring-gateway
      OTEL_SERVICE_NAMESPACE: reviews-dumpster-fire
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      BOOKS_ENDPOINT: http://books-api:8080
      REVIEWS_ENDPOINT: http://reviews-api:8080
    ports:
      - "9000:8080"
    depends_on:
      - otel-collector      

  books-api:
    build:
      context: .
      dockerfile: ./books/Dockerfile
    pull_policy: build
    environment: 
      OTEL_SERVICE_NAME: books-api
      OTEL_SERVICE_NAMESPACE: reviews-dumpster-fire
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql:3306/books"
      SPRING_DATASOURCE_USERNAME: "books"
      SPRING_DATASOURCE_PASSWORD: "doutorequemtemdoutorado"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      SPRING_JPA_SHOW_SQL: "true"
    ports:
      - "8090:8080"
    depends_on:
      - mysql
      - otel-collector

  reviews-api:
    build:
      context: .
      dockerfile: ./review/Dockerfile
    pull_policy: build
    environment: 
      OTEL_SERVICE_NAME: reviews-api
      OTEL_SERVICE_NAMESPACE: reviews-dumpster-fire
      OTEL_TRACES_EXPORTER: otlp
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      OTEL_EXPORTER_OTLP_PROTOCOL: http/protobuf
      OTEL_METRICS_EXPORTER: otlp
      OTEL_LOGS_EXPORTER: otlp
      SPRING_DATASOURCE_DRIVER_CLASS_NAME: "com.mysql.cj.jdbc.Driver"
      SPRING_DATASOURCE_URL: "jdbc:mysql://mysql-reviews:3306/reviews"
      SPRING_DATASOURCE_USERNAME: "reviews"
      SPRING_DATASOURCE_PASSWORD: "doutorequemtemdoutorado"
      SPRING_JPA_PROPERTIES_HIBERNATE_FORMAT_SQL: "false"
      SPRING_JPA_SHOW_SQL: "true"
      SPRING_REDIS_HOST: "redis"
      SPRING_REDIS_PORT: "6379"
      REVIEWS_BOOKS_ENDPOINT: "http://books-api:8080"
      LOGGING_LEVEL.ROOT: DEBUG
    ports:
      - "8070:8080"
    depends_on:
      - mysql-reviews
      - otel-collector

volumes:
  mysql_data:
  mysql_review_data: